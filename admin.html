<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiGiSUR | Admin Portal & Inventory Management</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrapper {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 5%;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .admin-card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
    }
    .admin-card-box h3 {
      font-size: 2rem;
      color: var(--accent-gold);
      margin-bottom: 5px;
    }
    .admin-card-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
    }
    @media (max-width: 992px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
    .admin-form-box, .admin-table-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
    }
    .admin-form-box h3, .admin-table-box h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-subtle);
    }
    th {
      color: var(--accent-gold);
      font-weight: 600;
      background: rgba(10, 22, 40, 0.5);
    }
    td img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
    .action-btns {
      display: flex;
      gap: 8px;
    }
    .btn-edit {
      background: rgba(212, 175, 0, 0.1);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-delete {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid #ff4d4d;
      color: #ff4d4d;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    /* Login Overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: var(--bg-secondary);
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      text-align: center;
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: var(--text-main);
    }
    .login-box h2 span {
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <!-- Login Modal Overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="nav-brand" style="justify-content: center; margin-bottom: 20px;">
        <i class="fas fa-shield-alt logo-icon"></i>
        <h1>DiGi<span>SUR</span></h1>
      </div>
      <h2>Admin Portal Login</h2>
      <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
        <div class="form-group" style="text-align: left;">
          <label for="adminPassword"></label>
          <input type="password" id="adminPassword" required placeholder="Enter admin password">
        </div>
        <button type="submit" class="btn-primary">Login to Dashboard</button>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;"><a href="index.html" style="color: var(--accent-gold);">← Back to Public Website</a></p>
      </form>
    </div>
  </div>

  <!-- Admin Content -->
  <div class="admin-wrapper" id="adminContent" style="display: none;">
    <div class="admin-header">
      <div class="nav-brand">
        <i class="fas fa-shield-alt logo-icon"></i>
        <h1>DiGi<span>SUR</span> Admin Dashboard</h1>
      </div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <a href="index.html" class="btn-outline" style="padding: 8px 16px; font-size: 0.85rem;"><i class="fas fa-globe"></i> View Website</a>
        <button id="logoutBtn" class="btn-outline" style="padding: 8px 16px; font-size: 0.85rem; border-color: #ff4d4d; color: #ff4d4d;"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="admin-stats">
      <div class="admin-card-box">
        <h3 id="statTotalProducts">0</h3>
        <p>Total Products</p>
      </div>
      <div class="admin-card-box">
        <h3 id="statCategories">4</h3>
        <p>Categories</p>
      </div>
      <div class="admin-card-box">
        <h3 id="statQuotes">0</h3>
        <p>Saved Quote Items</p>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="admin-grid">
      <!-- Add/Edit Product Form -->
      <div class="admin-form-box">
        <h3 id="formTitle"><i class="fas fa-plus-circle"></i> Add New Product</h3>
        <form id="productForm" class="contact-form">
          <input type="hidden" id="editProductId">
          <div class="form-group">
            <label for="prodName">Product Name</label>
            <input type="text" id="prodName" required placeholder="e.g. Hikvision 4K Camera">
          </div>
          <div class="form-group">
            <label for="prodCategory">Category</label>
            <select id="prodCategory">
              <option value="Surveillance">Surveillance</option>
              <option value="Computers">Computers</option>
              <option value="Security">Security</option>
              <option value="Electronics">Electronics</option>
            </select>
          </div>
          <div class="form-group">
            <label for="prodPrice">Price (MAD)</label>
            <input type="number" id="prodPrice" required placeholder="1490">
          </div>
          <div class="form-group">
            <label for="prodImage">Image URL (Unsplash)</label>
            <input type="url" id="prodImage" required placeholder="https://images.unsplash.com/...">
          </div>
          <div class="form-group">
            <label for="prodDesc">Description</label>
            <textarea id="prodDesc" required placeholder="Enter product specification..."></textarea>
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-primary" id="saveProductBtn" style="flex: 1;">Add Product</button>
            <button type="button" class="btn-outline" id="cancelEditBtn" style="display: none;" onclick="resetProductForm()">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Product List Table -->
      <div class="admin-table-box">
        <h3><i class="fas fa-boxes"></i> Product Inventory</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>
            <th:head></th:head>
            <tbody id="adminProductTableBody">
              <!-- Dynamically injected -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Admin Password Protection
    const ADMIN_PASS = "MOUSMAN2026";

    document.addEventListener('DOMContentLoaded', () => {
      const isAuthed = sessionStorage.getItem('digisur_authed') === 'true';
      if (isAuthed) {
        showDashboard();
      }

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASS) {
          sessionStorage.setItem('digisur_authed', 'true');
          showDashboard();
        } else {
          alert('Incorrect password');
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        sessionStorage.removeItem('digisur_authed');
        location.reload();
      });

      document.getElementById('productForm').addEventListener('submit', handleProductSubmit);
    });

    function showDashboard() {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      loadAdminData();
    }

    function getProducts() {
      return JSON.parse(localStorage.getItem('digisur_products')) || [];
    }

    function saveProducts(products) {
      localStorage.setItem('digisur_products', JSON.stringify(products));
    }

    function loadAdminData() {
      const products = getProducts();
      const quotes = JSON.parse(localStorage.getItem('digisur_quote')) || [];

      document.getElementById('statTotalProducts').textContent = products.length;
      document.getElementById('statQuotes').textContent = quotes.length;

      const tbody = document.getElementById('adminProductTableBody');
      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No products in inventory.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td><img src="${p.image}" alt="${p.name}"></td>
          <td><strong>${p.name}</strong></td>
          <td>${p.category}</td>
          <td style="color: var(--accent-gold); font-weight: 700;">${p.price.toLocaleString()} DH</td>
          <td>
            <div class="action-btns">
              <button class="btn-edit" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
              <button class="btn-delete" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function handleProductSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;
      const name = document.getElementById('prodName').value;
      const category = document.getElementById('prodCategory').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const image = document.getElementById('prodImage').value;
      const description = document.getElementById('prodDesc').value;

      let products = getProducts();

      if (id) {
        // Edit
        products = products.map(p => p.id == id ? { id: Number(id), name, category, price, image, description } : p);
        alert('Product updated successfully!');
      } else {
        // Add new
        const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
        products.push({ id: newId, name, category, price, image, description });
        alert('Product added successfully!');
      }

      saveProducts(products);
      resetProductForm();
      loadAdminData();
    }

    window.editProduct = function(id) {
      const products = getProducts();
      const p = products.find(item => item.id == id);
      if (!p) return;

      document.getElementById('editProductId').value = p.id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodImage').value = p.image;
      document.getElementById('prodDesc').value = p.description;

      document.getElementById('formTitle').innerHTML = `<i class="fas fa-edit"></i> Edit Product #${p.id}`;
      document.getElementById('saveProductBtn').textContent = 'Update Product';
      document.getElementById('cancelEditBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.deleteProduct = function(id) {
      if (confirm('Are you sure you want to delete this product?')) {
        let products = getProducts();
        products = products.filter(p => p.id != id);
        saveProducts(products);
        loadAdminData();
        alert('Product deleted successfully.');
      }
    }

    window.resetProductForm = function() {
      document.getElementById('productForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('formTitle').innerHTML = `<i class="fas fa-plus-circle"></i> Add New Product`;
      document.getElementById('saveProductBtn').textContent = 'Add Product';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }
  </script>
</body>
</html>
