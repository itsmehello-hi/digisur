<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>DiGiSUR | Site en Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #ff8c1a;
      font-family: 'Outfit', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    main { max-width: 900px; }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 2rem;
      border: 3px solid #ff8c1a; border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1.6s linear infinite;
    }
    h1 {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }
    p.lead {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 400;
      color: #ffa94d;
      margin-bottom: 0.75rem;
    }
    p.later {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      font-weight: 300;
      color: #ff8c1a;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .icon { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true"></div>
    <h1>Site en Maintenance</h1>
    <p class="lead">On travaille sur quelque chose de nouveau</p>
    <p class="later">Revenez plus tard</p>
  </main>
</body>
</html>
